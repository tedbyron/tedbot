[package]
name = "tedbot"
version = "0.1.0"
edition = "2024"
description = "Discord bot!"
authors = ["Teddy Byron <ted@tedbyron.com>"]
repository = "https://github.com/tedbyron/tedbot"
license = "MIT OR Apache-2.0"
readme = "../README.md"
keywords = ["discord", "bot"]
publish = false

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", default-features = false, features = [
  "http1",
  "tokio",
] }
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
futures = "0.3.34"
poise = "0.7.1"
quick-xml = { version = "0.42.0", features = ["serialize"] }
reqwest = { version = "0.12.28", default-features = false, features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54.1", features = [
  "rt-multi-thread",
  "macros",
  "net",
  "sync",
] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
