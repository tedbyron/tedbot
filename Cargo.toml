[workspace]
members = ["poise-jellyfin", "tedbot"]
resolver = "2"

[workspace.package]
edition = "2024"
authors = ["Teddy Byron <ted@tedbyron.com>"]
repository = "https://github.com/tedbyron/tedbot"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1.0.104"
poise = "0.7.1"
reqwest = { version = "0.13.5", default-features = false, features = [
  "json",
  "query",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
tokio = "1.54.1"
toml = "1.1.8"
tracing = "0.1.44"

[profile.dev]
debug = 0

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
