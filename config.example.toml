# Log level: error, warn (default), info, debug or trace
# log_level = 'info'

[discord]
token = ''
# User ids of the bot's admins, in every server. They're pinged for requests waiting for approval.
# admins = ['123456789012345678']

# Bot activity (competing [in] || listening [to] || playing || streaming || watching)
[discord.activity]
# type = 'listening'
# name = '/commands'
# streaming_url =

[jellyfin]
api_key = ''
# url = 'http://localhost:8096'
# The Moonfin plugin is installed, so "now available" posts should link to Moonfin Web
# moonfin = true
# Jellyfin's launchd agent, which admins can restart with /restart
# launchd_label = 'org.nixos.jellyfin'

[seerr]
api_key = ''
public_url = 'https://seerr.example.com'
# url = 'http://localhost:5055'

# Listener for Seerr's webhook, on localhost. Set Seerr's webhook URL to
# http://localhost:<port>/seerr. Seerr only has one webhook, so anything else
# that used it goes in forward, one URL or a list. Seerr gets the first failed
# response, else the first one.
# [seerr.webhook]
# port = 5056
# forward = ['http://localhost:8096/Moonfin/Seerr/Webhook?secret=...']
# Channels to post in when a request is made, bot needs permission to mention
# all roles
# requests_channels = ['123456789012345678']
# Channels to post in when a request is available in Jellyfin
# available_channels = ['123456789012345678']

# Radarr and Sonarr, so /request and /requests can cancel approved requests that
# are still downloading. Without them, only requests waiting for approval can be
# cancelled.
# [radarr]
# api_key = ''
# url = 'http://localhost:7878'

# [sonarr]
# api_key = ''
# url = 'http://localhost:8989'

# The same for 4K requests, which Seerr sends to its 4K servers
# [radarr_4k]
# api_key = ''
# url = 'http://localhost:7879'

# [sonarr_4k]
# api_key = ''
# url = 'http://localhost:8990'

# [ersatztv]
# url = 'http://localhost:8409'
