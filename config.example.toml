# Log level: off, error, warn (default), info, debug or trace. RUST_LOG overrides it.
# log_level = 'info'

[discord]
token = ''
# User ids of the bot's admins, in every server.
# admins = ['123456789012345678']

# Channels for admins. New requests are posted here with buttons to approve
# them (needs [seerr.webhook]), and Jellyfin accounts being disabled (by an admin or after too
# many failed sign-ins) or enabled again, checked every 15 minutes.
# admin_channels = ['123456789012345678']
# Channels to post in when a request is available in Jellyfin (needs
# [seerr.webhook])
# available_channels = ['123456789012345678']

# Bot activity (competing [in] || listening [to] || playing || streaming || watching)
[discord.activity]
# type = 'listening'
# name = '/commands'
# streaming_url =

[jellyfin]
api_key = ''
# url = 'http://localhost:8096'
# The Moonfin plugin is installed, so "now available" posts should link to Moonfin Web
# moonfin = true
# Restarts Jellyfin for /restart, run without a shell. Without it, Jellyfin is
# asked to restart itself, which it can't do if the process is hanging. For example:
# restart_command = ['sh', '-c', 'launchctl kickstart -k gui/$(id -u)/org.nixos.jellyfin']
# restart_command = ['systemctl', '--user', 'restart', 'jellyfin']

[seerr]
api_key = ''
public_url = 'https://seerr.example.com'
# url = 'http://localhost:5055'

# Listener for Seerr's webhook, on localhost. Set Seerr's webhook URL to
# http://localhost:<port>/seerr. Seerr only has one webhook, so anything else
# that used it goes in forward, one URL or a list. Seerr gets the first failed
# response, else the first one.
# [seerr.webhook]
# port = 5056
# forward = ['http://localhost:8096/Moonfin/Seerr/Webhook?secret=...']

# Radarr and Sonarr, so /request and /requests can cancel approved requests that
# are still downloading. Without them, only requests waiting for approval can be
# cancelled.
# [radarr]
# api_key = ''
# url = 'http://localhost:7878'

# [sonarr]
# api_key = ''
# url = 'http://localhost:8989'

# The same for 4K requests, which Seerr sends to its 4K servers
# [radarr_4k]
# api_key = ''
# url = 'http://localhost:7879'

# [sonarr_4k]
# api_key = ''
# url = 'http://localhost:8990'

# [ersatztv]
# url = 'http://localhost:8409'
